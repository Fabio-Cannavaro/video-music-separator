name: Repository safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check tracked files and sensitive text
        run: python scripts/check_repository_safety.py
